<!DOCTYPE html>
<html>
<head>
    <title>Bank Performance Dashboard - Redirecting...</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .message {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .countdown {
            font-size: 48px;
            font-weight: bold;
            color: #00ff00;
        }
    </style>
    <!-- Refresh after 5 seconds, switch to the next report via URL parameter -->
    <meta http-equiv="refresh" content="5; url=https://yourusername.github.io/your-repo-name/?report=1">
</head>
<body>
    <div>
        <div class="message">Loading the first performance dashboard shortly...</div>
        <div class="countdown" id="timer">5</div>
    </div>

    <script>
        // Simple countdown effect
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        setInterval(() => {
            timeLeft -= 1;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                // meta refresh will handle the redirect
            }
        }, 1000);

        // --- Core Logic: Decide which report to redirect to based on URL parameter ---
        // Get the 'report' value from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        let reportIndex = parseInt(urlParams.get('report')) || 0; // Default to 0

        // Your 4 direct Power BI report links
        const powerbiReports = [
            'https://app.powerbi.com/groups/me/apps/60735cc2-0d88-4060-84b9-47dbf0dfebda/reports/f4152d96-6534-411e-8034-affb338ab745/ReportSection20a0900b2d9460718da4?ctid=27439031-8cd6-49af-b8b4-6f97e6cdf6d3&experience=power-bi', // Report 1
            'https://app.powerbi.com/groups/me/apps/60735cc2-0d88-4060-84b9-47dbf0dfebda/reports/f4152d96-6534-411e-8034-affb338ab745/ReportSection16d679b3c27591cc904e?ctid=27439031-8cd6-49af-b8b4-6f97e6cdf6d3&experience=power-bi', // Report 2
            'https://app.powerbi.com/groups/me/apps/60735cc2-0d88-4060-84b9-47dbf0dfebda/reports/cae04bff-f363-415e-a3ab-38f0d0ccd3ad/ReportSection7e8febe7c710d2940518?ctid=27439031-8cd6-49af-b8b4-6f97e6cdf6d3&experience=power-bi', // Report 3
            'https://app.powerbi.com/groups/me/apps/60735cc2-0d88-4060-84b9-47dbf0dfebda/reports/19d6c5f9-0fe1-4236-b7f3-07776cf8b240/ReportSectione3b80c402403791b9503?ctid=27439031-8cd6-49af-b8b4-6f97e6cdf6d3&experience=power-bi'  // Report 4
        ];

        // Calculate the next report index
        let nextReportIndex = (reportIndex + 1) % powerbiReports.length;

        // Set the meta refresh redirect target, pointing to yourself with the next parameter
        // This way, after 5 seconds the page refreshes with the ?report=1 parameter, redirecting to Report 2
        // Note: Replace this URL with your own GitHub Pages address
        const refreshUrl = `https://yourusername.github.io/your-repo-name/?report=${nextReportIndex}`;
        document.querySelector('meta[http-equiv="refresh"]').setAttribute('content', `5; url=${refreshUrl}`);

        // --- Execute Immediately: Redirect to the report specified by the current parameter ---
        // If reportIndex is valid, immediately redirect to the corresponding Power BI link
        if (reportIndex >= 0 && reportIndex < powerbiReports.length) {
            console.log(`Redirecting to report ${reportIndex + 1}`);
            window.location.href = powerbiReports[reportIndex];
        } else {
            // If the parameter is invalid, redirect to the first report
            console.log("Invalid parameter, redirecting to report 1");
            window.location.href = powerbiReports[0];
        }
    </script>
</body>
</html>
